# Tiny Tapeout project information
project:
  title: "KIBO Leak-Inspection Target Controller"
  author: "Your Name"
  discord: ""
  description: "8-state FSM that approaches, aligns to, holds at and inspects a target, with a latched safety abort."
  language: "Verilog"
  clock_hz: 10000
  tiles: "1x1"
  top_module: "tt_um_kibo_leak_inspect"
  source_files:
    - "project.v"

# Pin names shown in the datasheet
pinout:
  ui[0]: "target_detected"
  ui[1]: "target_reached"
  ui[2]: "position_aligned"
  ui[3]: "orientation_aligned"
  ui[4]: "inspection_done"
  ui[5]: "obstacle_detected"
  ui[6]: "system_fault"
  ui[7]: "new_target"

  uo[0]: "move_cmd[0]"
  uo[1]: "move_cmd[1]"
  uo[2]: "move_cmd[2]"
  uo[3]: "align_cmd[0]"
  uo[4]: "align_cmd[1]"
  uo[5]: "inspect_enable"
  uo[6]: "abort_cmd"
  uo[7]: "target_locked"

  uio[0]: "state[0]"
  uio[1]: "state[1]"
  uio[2]: "state[2]"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change
yaml_version: 6
